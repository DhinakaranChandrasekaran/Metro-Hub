# ================================
# Production Profile - MetroHub
# ================================
# Activated by: SPRING_PROFILES_ACTIVE=prod
# All env vars come from Render dashboard (not .env file)
# ================================

# spring-dotenv: gracefully ignored when .env file is absent
# In Docker containers, .env is excluded by .dockerignore
# Spring resolves ${DB_URL} etc. from system environment variables

# ================================
# DATABASE (Production - Aiven MySQL)
# ================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ================================
# JPA (Production settings)
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ================================
# LOGGING (Production - stdout for Docker)
# ================================
logging.level.root=WARN
logging.level.com.metrohub=INFO
logging.level.com.metrohub.security=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=
logging.pattern.console=%d{ISO8601} %-5level [%thread] %logger{36} - %msg%n

# ================================
# DEVTOOLS (Disabled in production)
# ================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
