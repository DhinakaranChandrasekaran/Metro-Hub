# ================================
# METROHUB APPLICATION CONFIGURATION
# ================================
# Format: application.properties
# ================================

# ================================
# DATABASE CONFIGURATION
# ================================
spring.application.name=metrohub-api
spring.datasource.url=jdbc:mysql://localhost:3306/metrohub_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ================================
# FILE UPLOAD CONFIGURATION
# ================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.file-size-threshold=2KB

# ================================
# EMAIL CONFIGURATION
# ================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ================================
# AWS S3 CONFIGURATION
# ================================
metrohub.s3.bucket-name=${S3_BUCKET_NAME}
metrohub.s3.access-key=${S3_ACCESS_KEY}
metrohub.s3.secret-key=${S3_SECRET_KEY}
metrohub.s3.region=${S3_REGION}

# ================================
# FILE STORAGE (local fallback)
# ================================
metrohub.file-storage.upload-dir=${user.home}/metrohub-uploads
metrohub.file-storage.allowed-types=application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/jpeg,image/png
metrohub.file-storage.max-file-size-mb=10

# ================================
# JWT SECURITY SETTINGS
# ================================
metrohub.jwt.secret=${JWT_SECRET}
metrohub.jwt.refresh-expiration-ms=604800000
metrohub.jwt.issuer=metrohub-api

# ================================
# NOTIFICATION SETTINGS
# ================================
metrohub.notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:true}
metrohub.notifications.email.from-address=${MAIL_FROM:noreply@metrohub.local}
metrohub.notifications.email.from-name=MetroHub Document System
metrohub.notifications.email.retry-attempts=3
metrohub.notifications.email.retry-delay-ms=5000
metrohub.notifications.sms.enabled=${NOTIFICATIONS_SMS_ENABLED:true}
metrohub.notifications.sms.provider=twilio
metrohub.notifications.sms.from-number=${TWILIO_PHONE_NUMBER}
metrohub.notifications.sms.retry-attempts=3
metrohub.notifications.sms.retry-delay-ms=5000
metrohub.notifications.sms.mock-enabled=${SMS_MOCK_ENABLED:true}
metrohub.notifications.twilio.account-sid=${TWILIO_ACCOUNT_SID}
metrohub.notifications.twilio.auth-token=${TWILIO_AUTH_TOKEN}
metrohub.notifications.dashboard.enabled=true
metrohub.notifications.batch.enabled=true
metrohub.notifications.batch.process-cron=0 */5 * * * *
metrohub.notifications.batch.batch-size=50

# ================================
# TEXT EXTRACTION
# ================================
metrohub.extraction.tika.max-text-length=100000
metrohub.extraction.ocr.enabled=true
metrohub.extraction.ocr.language=eng
metrohub.extraction.ocr.tessdata-path=${TESSDATA_PREFIX:}

# ================================
# CLASSIFICATION
# ================================
metrohub.classification.rules-file=classpath:classification-rules.json
metrohub.classification.confidence-threshold=0.6

# ================================
# DASHBOARD SETTINGS
# ================================
metrohub.dashboard.default-page-size=20
metrohub.dashboard.max-page-size=100
metrohub.dashboard.recent-days=7
metrohub.dashboard.stats-cache-ttl=60

# ================================
# ALERT SETTINGS
# ================================
metrohub.alerts.enabled=true
metrohub.alerts.deadline-check-cron=0 0 * * * *
metrohub.alerts.cleanup-cron=0 0 2 * * *
metrohub.alerts.retention-days=30
metrohub.alerts.approaching-threshold-days=3
metrohub.alerts.duplicate-prevention-hours=24
metrohub.alerts.routing.high-priority=DASHBOARD,EMAIL,SMS
metrohub.alerts.routing.medium-priority=DASHBOARD,EMAIL
metrohub.alerts.routing.low-priority=DASHBOARD

# ================================
# SEARCH SETTINGS
# ================================
metrohub.search.default-page-size=20
metrohub.search.max-results=1000
metrohub.search.min-keyword-length=2
metrohub.search.fuzzy-enabled=false

# ================================
# LOGGING
# ================================
logging.level.root=INFO
logging.level.com.metrohub=DEBUG
logging.level.com.metrohub.service.impl.AlertServiceImpl=INFO
logging.level.com.metrohub.service.impl.DashboardServiceImpl=INFO
logging.level.com.metrohub.service.impl.SearchServiceImpl=INFO
logging.level.com.metrohub.service.impl.NotificationServiceImpl=INFO
logging.level.com.metrohub.service.impl.AuthServiceImpl=INFO
logging.level.com.metrohub.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/metrohub.log

# ================================
# SCHEDULER SETTINGS
# ================================
spring.task.scheduling.enabled=true
spring.task.scheduling.thread-name-prefix=compliance-scheduler-
spring.task.scheduling.pool.size=5

# ================================
# SERVER
# ================================
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-stacktrace=never