# ============================================
# MetroHub Frontend - Nginx Configuration
# ============================================
# SPA routing, compression, caching, security
# ============================================

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # SPA ROUTING
    # React Router: all routes fallback to index.html
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # STATIC ASSETS CACHING
    # CRA hashes filenames in /static/ so they are
    # safe to cache for a long time
    # ============================================
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============================================
    # INDEX.HTML - No cache
    # Must always fetch latest to get new JS/CSS refs
    # ============================================
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ============================================
    # GZIP COMPRESSION
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ============================================
    # SECURITY HEADERS
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================
    # ERROR PAGES
    # ============================================
    error_page 404 /index.html;
}
