# ============================================
# MetroHub - Production Docker Compose
# ============================================
# Use this for deploying backend + frontend ONLY.
# Database (MySQL) is external (Aiven / AWS RDS / Railway etc.)
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# Required env vars (set in .env or hosting dashboard):
#   DB_URL        - External MySQL JDBC URL
#   DB_USERNAME   - DB username
#   DB_PASSWORD   - DB password
#   JWT_SECRET    - Min 256-bit secret
#   MAIL_USERNAME - Gmail address
#   MAIL_PASSWORD - Gmail App Password
#   S3_BUCKET_NAME, S3_ACCESS_KEY, S3_SECRET_KEY, S3_REGION
#   CORS_ALLOWED_ORIGINS - Frontend URL (e.g. https://metrohub.vercel.app)
#   REACT_APP_API_URL    - Backend URL (e.g. https://api.metrohub.com/api)
#   SPRING_PROFILES_ACTIVE=prod
# ============================================

services:

  # ============================================
  # Spring Boot Backend
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: metrohub-backend:latest
    container_name: metrohub-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      TESSDATA_PREFIX: /usr/share/tessdata
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - metrohub-network

  # ============================================
  # React Frontend (Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass your actual backend public URL at build time
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080/api}
    image: metrohub-frontend:latest
    container_name: metrohub-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - metrohub-network

# ============================================
# Network
# ============================================
networks:
  metrohub-network:
    driver: bridge
